name: Docs

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/uksa-software-data-ai-training
  GITOPS_REPO: icg-innovation/space-k8s-gitops
  GITOPS_OWNER: icg-innovation
  GITOPS_REPOSITORY: space-k8s-gitops
  GITOPS_BRANCH: main
  GITOPS_FILE: apps/base/uksa-training-jupyterbook/deployment.yaml

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install docs dependencies
        run: npm ci

      - name: Check repository hygiene
        run: npm run check:docs

      - name: Build static book
        run: npm run build:docs

  container:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.image-ref.outputs.image_ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Capture immutable image reference
        id: image-ref
        run: echo "image_ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

      - name: Smoke check container
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          CONTAINER="uksa-docs-smoke-$$"
          docker run -d --name "$CONTAINER" -p 8080:8080 "$IMAGE"
          trap 'docker rm -f "$CONTAINER" >/dev/null 2>&1 || true' EXIT
          sleep 3

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/jupyterbook/)
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: /jupyterbook/ returned $STATUS"
            docker logs "$CONTAINER"
            exit 1
          fi

          REDIRECT=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/uksa-training/)
          if [ "$REDIRECT" != "301" ]; then
            echo "FAIL: /uksa-training/ returned $REDIRECT"
            docker logs "$CONTAINER"
            exit 1
          fi

  open-gitops-pr:
    name: Open GitOps PR
    runs-on: ubuntu-latest
    needs: container
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check required GitHub App configuration
        env:
          SPACE_GITOPS_APP_CLIENT_ID: ${{ vars.SPACE_GITOPS_APP_CLIENT_ID }}
          SPACE_GITOPS_APP_PRIVATE_KEY: ${{ secrets.SPACE_GITOPS_APP_PRIVATE_KEY }}
        run: |
          test -n "$SPACE_GITOPS_APP_CLIENT_ID" || {
            echo "::error::Missing required Actions variable SPACE_GITOPS_APP_CLIENT_ID"
            exit 1
          }

          test -n "$SPACE_GITOPS_APP_PRIVATE_KEY" || {
            echo "::error::Missing required Actions secret SPACE_GITOPS_APP_PRIVATE_KEY"
            exit 1
          }

      - name: Create GitOps GitHub App token
        id: gitops-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SPACE_GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.SPACE_GITOPS_APP_PRIVATE_KEY }}
          owner: ${{ env.GITOPS_OWNER }}
          repositories: ${{ env.GITOPS_REPOSITORY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out GitOps repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.GITOPS_REPO }}
          ref: ${{ env.GITOPS_BRANCH }}
          token: ${{ steps.gitops-app-token.outputs.token }}
          path: gitops
          persist-credentials: false

      - name: Update pinned image digest
        working-directory: gitops
        env:
          IMAGE_REF: ${{ needs.container.outputs.image_ref }}
          GITOPS_FILE: ${{ env.GITOPS_FILE }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import re
          from pathlib import Path

          image_ref = os.environ["IMAGE_REF"]
          path = Path(os.environ["GITOPS_FILE"])
          text = path.read_text()
          pattern = re.compile(
              r"^(\s*image:\s*)ghcr\.io/(?:xangma|icg-innovation)/"
              r"uksa-software-data-ai-training"
              r"(?::[A-Za-z0-9_.-]+|@sha256:[A-Fa-f0-9]{64})(\s*)$",
              re.MULTILINE,
          )
          updated, count = pattern.subn(rf"\g<1>{image_ref}\2", text)
          if count != 1:
              raise SystemExit(f"Expected to update 1 image line in {path}, updated {count}")
          path.write_text(updated)
          PY

          grep -q "$IMAGE_REF" "$GITOPS_FILE"
          grep -n "image:" "$GITOPS_FILE"
          git diff -- "$GITOPS_FILE"

      - name: Create or update GitOps pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.gitops-app-token.outputs.token }}
          path: gitops
          base: ${{ env.GITOPS_BRANCH }}
          branch: automation/uksa-training-jupyterbook-image
          delete-branch: true
          commit-message: "Update UKSA training JupyterBook image to ${{ needs.container.outputs.image_ref }}"
          title: "Update UKSA training JupyterBook image to ${{ github.sha }}"
          body: |
            Automated image promotion from `${{ github.repository }}`.

            Image:
            `${{ needs.container.outputs.image_ref }}`

            Source commit:
            `${{ github.sha }}`

            Workflow run:
            `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
          add-paths: |
            ${{ env.GITOPS_FILE }}
